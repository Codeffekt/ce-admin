<ce-nav-layout> 
    
    <ce-navbar ceNavBar>
        <ce-navbar-content>
          <ce-navbar-item>{{spaceContextForm | valueForKey:'name'}}</ce-navbar-item>
          <ce-navbar-actions>
            <a mat-stroked-button color="accent" matTooltip="Ajouter une entrée" (click)="onCreateEntry()">
              <mat-icon>add</mat-icon>Ajouter une entrée
            </a>
          </ce-navbar-actions>
        </ce-navbar-content>
      </ce-navbar>

    <ce-formquery-wrapper [paginationEnabled]="true" [searchEnabled]="true">
        <ce-list>
            <ce-list-item *ngFor="let form of forms$ | async" (click)="onSelected(form)">
                <ce-list-item-factory [type]="form.core.root" [item]="form">
                </ce-list-item-factory>                        
            </ce-list-item>            
        </ce-list>
    </ce-formquery-wrapper>
</ce-nav-layout>
